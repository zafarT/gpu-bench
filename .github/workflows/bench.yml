name: bench
on:
  push:
  workflow_dispatch:
    inputs:
      slowdown:
        description: "Demo: multiply results by this factor (0.7 = 30% slower)"
        default: "1.0"

# Runs share one database through the cache, so run them one at a time.
concurrency:
  group: bench-${{ github.ref }}

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      BENCH_SLOWDOWN: ${{ inputs.slowdown || '1.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install glmark2 (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y glmark2 xvfb

      # CPU build of torch: the runners have no GPU, and it is much smaller.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt

      # Runners are deleted after every job, so the database is carried from
      # run to run with the cache. A failed (regressed) run is not saved,
      # so it can't become part of the baseline.
      - uses: actions/cache@v4
        with:
          path: results.db
          key: results-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: results-v2-${{ runner.os }}-

      - run: pytest
      - run: python -m bench --db results.db

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: results.db